<!doctype html>
<html lang="en" class="splash-open">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Aztlan Isle: a calm, tactile god game. Guide a tribe settling a lush tropical island." />
    <title>Aztlan Isle</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=3" />
    <!-- Home screen: icon, full-screen launch and name on iPhone / iPad. -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Aztlan Isle" />
    <meta name="application-name" content="Aztlan Isle" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      // Each release replaces the game files, so a cached copy of this page (browsers keep it for a
      // while, home-screen apps longer) can point at files that no longer exist. If one fails to
      // load, or the game hasn't started after a while, fetch the page afresh once rather than hang
      // on the splash; after that, offer a retry.
      (function () {
        var KEY = 'aztlan-isle-reloaded';
        function fresh() {
          try {
            if (sessionStorage.getItem(KEY)) return false;
            sessionStorage.setItem(KEY, '1');
          } catch (e) {
            /* no session storage: still try once */
          }
          var u = new URL(location.href);
          u.searchParams.set('r', Date.now().toString(36));
          location.replace(u.href);
          return true;
        }
        function stuck() {
          if (window.aztlanBooted || window.aztlanBootError || fresh()) return;
          var t = document.getElementById('loading-text');
          if (t) {
            t.classList.remove('hidden');
            t.textContent = 'The island could not load. Tap to try again.';
            t.style.cursor = 'pointer';
            t.onclick = function () { location.reload(); };
          }
        }
        window.addEventListener('error', function (e) {
          var el = e.target;
          if (el && (el.tagName === 'SCRIPT' || el.tagName === 'LINK') && /\/assets\//.test(el.src || el.href || '')) stuck();
        }, true);
        setTimeout(stuck, 30000);
      })();
    </script>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <div id="loading">
      <div class="splash-frame">
        <img class="splash-art" src="./splash.webp?v=4" alt="Aztlan Isle" />
        <div class="splash-ui">
          <div class="loading-sub" id="loading-text">Shaping the island…</div>
          <button id="play-btn" class="play hidden">Play</button>
          <p class="splash-hint">FOR BEST GAMEPLAY CLICK SHARE &amp; ADD TO HOME SCREEN</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
