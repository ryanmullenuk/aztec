<!doctype html>
<html lang="en" class="splash-open brand-open">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Aztlan Isle: a calm, tactile god game. Guide a tribe settling a lush tropical island." />
    <title>Aztlan Isle</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=3" />
    <!-- Home screen: icon, full-screen launch and name on iPhone / iPad. -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Overlay iOS status indicators on the game instead of reserving a solid top bar. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aztlan Isle" />
    <meta name="application-name" content="Aztlan Isle" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preload" as="image" href="./redhead-intro.jpeg?v=2" />
    <style>
      /* Inline so the studio splash covers the first paint, before the game bundle loads. */
      html.brand-open, html.brand-open body { margin: 0; background: #000; }
      #studio-splash {
        position: fixed; inset: 0; z-index: 10000; background: #000;
        display: grid; place-items: center; opacity: 1;
        transition: opacity 900ms ease; touch-action: none;
      }
      #studio-splash { height: var(--app-h, 100dvh); }
      .studio-logo { position: relative; overflow: hidden; width: min(72vw, 48dvh, 460px); aspect-ratio: 800 / 780; }
      /* Frame only the supplied logo; discard the screenshot's empty margins and ghost UI. */
      #studio-splash img { position: absolute; display: block; width: 153.25%; max-width: none; height: auto; left: -27.5%; top: -117.9487%; }
      #studio-splash.leaving { opacity: 0; }
      @media (prefers-reduced-motion: reduce) { #studio-splash { transition: none; } }
    </style>
    <script>
      // Each release replaces the game files, so a cached copy of this page (browsers keep it for a
      // while, home-screen apps longer) can point at files that no longer exist. If one fails to
      // load, or the game hasn't started after a while, fetch the page afresh once rather than hang
      // on the splash; after that, offer a retry.
      (function () {
        var KEY = 'aztlan-isle-reloaded';
        function fresh() {
          try {
            if (sessionStorage.getItem(KEY)) return false;
            sessionStorage.setItem(KEY, '1');
          } catch (e) {
            /* no session storage: still try once */
          }
          var u = new URL(location.href);
          u.searchParams.set('r', Date.now().toString(36));
          location.replace(u.href);
          return true;
        }
        function stuck() {
          if (window.aztlanBooted || window.aztlanBootError || fresh()) return;
          var t = document.getElementById('loading-text');
          if (t) {
            t.classList.remove('hidden');
            t.textContent = 'The island could not load. Tap to try again.';
            t.style.cursor = 'pointer';
            t.onclick = function () { location.reload(); };
          }
        }
        window.addEventListener('error', function (e) {
          var el = e.target;
          if (el && (el.tagName === 'SCRIPT' || el.tagName === 'LINK') && /\/assets\//.test(el.src || el.href || '')) stuck();
        }, true);
        setTimeout(stuck, 30000);
      })();
    </script>
  </head>
  <body>
    <div id="studio-splash" role="img" aria-label="Redhead Games">
      <div class="studio-logo"><img src="./redhead-intro.jpeg?v=2" alt="" fetchpriority="high" /></div>
    </div>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <div id="loading">
      <div class="splash-frame">
        <img class="splash-art" src="./splash.webp?v=4" alt="Aztlan Isle" />
        <div class="splash-ui">
          <div class="loading-sub" id="loading-text">Shaping the island…</div>
          <button id="play-btn" class="play hidden">Play</button>
          <p class="splash-hint">FOR BEST GAMEPLAY CLICK SHARE &amp; ADD TO HOME SCREEN</p>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var splash = document.getElementById('studio-splash');
        var logo = splash.querySelector('img');
        var title = document.querySelector('.splash-art');
        var started = false;
        function ready(image) {
          if (image.complete) return Promise.resolve();
          return new Promise(function (resolve) {
            image.addEventListener('load', resolve, { once: true });
            image.addEventListener('error', resolve, { once: true });
          });
        }
        function remove() {
          splash.remove();
          document.documentElement.classList.remove('brand-open');
        }
        function fade() {
          if (started) return;
          started = true;
          splash.classList.add('leaving');
          splash.addEventListener('transitionend', remove, { once: true });
          setTimeout(remove, 1000);
        }
        // Keep this independent of game boot so a loading error never traps the player.
        Promise.all([
          ready(logo).then(function () { return new Promise(function (resolve) { setTimeout(resolve, 2000); }); }),
          ready(title)
        ]).then(fade);
        setTimeout(fade, 8000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
